<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1010" width="1560" height="1010">
<title>Infografia de metricas</title>
<defs>
<marker id="arsoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.2 L9 5 L1.2 8.8" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arbad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.2 L9 5 L1.2 8.8" fill="none" stroke="#B42318" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="argood" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.2 L9 5 L1.2 8.8" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="araccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.2 L9 5 L1.2 8.8" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arwarn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.2 L9 5 L1.2 8.8" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="1.6" cy="1.6" r="1.5" fill="#EDF1F7"/>
</pattern>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.07"/>
</filter>
</defs>
<rect width="1560" height="1010" fill="#FFFFFF"/>
<rect x="0" y="0" width="1560" height="9" fill="#2563EB"/><text x="46" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" letter-spacing="0.5">Infografía · MAE, RMSE y R²</text><text x="46" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="700" fill="#64748B">Qué mide cada una y por qué se usan juntas</text><text x="46" y="156" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#94A3B8">Métricas de regresión para monitorear el error de consumo en kWh</text><line x1="46" y1="178" x2="1514" y2="178" stroke="#E2E8F0" stroke-width="1.6"/><rect x="46" y="200" width="486" height="600" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.8" filter="url(#sombra)"/><rect x="46" y="200" width="486" height="7" rx="3.5" fill="#2563EB"/><rect x="72" y="230" width="62" height="62" rx="16" fill="#EFF4FF" stroke="#2563EB" stroke-width="2"/><g transform="translate(86.0,244.0) scale(1.4167)" fill="none" stroke="#2563EB" stroke-width="1.90" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></g><text x="150" y="258" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#2563EB">MAE</text><text x="150" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#64748B">Error absoluto medio</text><rect x="72" y="314" width="434" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><text x="90" y="347" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="21" font-weight="700" fill="#0F172A">(1/n) Σ |y − ŷ|</text><text x="488" y="347" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="end">unidad: kWh/día</text><text x="72" y="395" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0F172A" font-weight="600">El error promedio en las mismas unidades del</text><text x="72" y="422" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0F172A" font-weight="600">objetivo:</text><text x="72" y="459" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">Trata todos los errores igual, así que no se deja</text><text x="72" y="485" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">arrastrar por un día raro. Es la métrica que</text><text x="72" y="511" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">operaciones entiende de un vistazo: «en promedio</text><text x="72" y="537" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">nos equivocamos en X kWh».</text><rect x="72" y="722" width="434" height="56" rx="12" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.6"/><text x="90" y="746" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#2563EB" letter-spacing="1.1">CUÁNDO USARLA</text><text x="90" y="768" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#2563EB" font-weight="600">Monitoreo diario, comunicación con el</text><text x="90" y="789" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#2563EB" font-weight="600">negocio</text><rect x="555" y="200" width="486" height="600" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.8" filter="url(#sombra)"/><rect x="555" y="200" width="486" height="7" rx="3.5" fill="#B42318"/><rect x="581" y="230" width="62" height="62" rx="16" fill="#FEF3F2" stroke="#B42318" stroke-width="2"/><g transform="translate(595.0,244.0) scale(1.4167)" fill="none" stroke="#B42318" stroke-width="1.90" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6 21 19H3z"/><path d="M12 9.5v4.2M12 16.6v.1"/></g><text x="659" y="258" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#B42318">RMSE</text><text x="659" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#64748B">Raíz del error cuadrático medio</text><rect x="581" y="314" width="434" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><text x="599" y="347" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="21" font-weight="700" fill="#0F172A">√( (1/n) Σ (y − ŷ)² )</text><text x="997" y="347" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="end">unidad: kWh/día</text><text x="581" y="395" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0F172A" font-weight="600">El error típico cuando los errores grandes</text><text x="581" y="422" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0F172A" font-weight="600">pesan más:</text><text x="581" y="459" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">Eleva al cuadrado antes de promediar, así que un</text><text x="581" y="485" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">error de 20 kWh pesa 400 veces más que uno de 1</text><text x="581" y="511" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">kWh. Es la alarma: las «fallas drásticas» inflan</text><text x="581" y="537" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">el RMSE y saltan a la vista.</text><rect x="581" y="722" width="434" height="56" rx="12" fill="#FEF3F2" stroke="#B42318" stroke-width="1.6"/><text x="599" y="746" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#B42318" letter-spacing="1.1">CUÁNDO USARLA</text><text x="599" y="768" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#B42318" font-weight="600">Alarma de degradación y comparación entre</text><text x="599" y="789" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#B42318" font-weight="600">modelos</text><rect x="1064" y="200" width="486" height="600" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.8" filter="url(#sombra)"/><rect x="1064" y="200" width="486" height="7" rx="3.5" fill="#6D28D9"/><rect x="1090" y="230" width="62" height="62" rx="16" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/><g transform="translate(1104.0,244.0) scale(1.4167)" fill="none" stroke="#6D28D9" stroke-width="1.90" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="1168" y="258" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#6D28D9">R²</text><text x="1168" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#64748B">Coeficiente de determinación</text><rect x="1090" y="314" width="434" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><text x="1108" y="347" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="21" font-weight="700" fill="#0F172A">1 − SS_res / SS_tot</text><text x="1506" y="347" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="end">unidad: 0 a 1</text><text x="1090" y="395" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0F172A" font-weight="600">Qué porción de la variabilidad del consumo</text><text x="1090" y="422" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0F172A" font-weight="600">explica el modelo:</text><text x="1090" y="459" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">Es una medida relativa, sin unidades: sirve para</text><text x="1090" y="485" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">comparar el mismo modelo entre estaciones (verano</text><text x="1090" y="511" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">contra invierno). Con un valor negativo avisa que</text><text x="1090" y="537" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">el modelo predice peor que decir siempre el</text><text x="1090" y="563" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" fill="#64748B">promedio.</text><rect x="1090" y="722" width="434" height="56" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/><text x="1108" y="746" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#6D28D9" letter-spacing="1.1">CUÁNDO USARLA</text><text x="1108" y="768" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#6D28D9" font-weight="600">Comparación relativa entre períodos</text><rect x="46" y="826" width="1468" height="150" rx="16" fill="#0F172A"/><text x="76" y="874" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF">Cómo se leen juntas (y por qué no alcanza con una sola)</text><text x="76" y="912" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#DBE4F0">MAE da la magnitud del error típico en kWh · RMSE es la alarma cuando hay errores grandes · R² dice cuánta variabilidad explica el modelo.</text><text x="76" y="946" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#93C5FD">Regla práctica: si RMSE ≫ MAE aparecieron errores atípicos grandes — la firma del drift. Nunca monitorear con R² solo.</text>
</svg>